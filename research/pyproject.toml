[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-search"
version = "0.6.0"
description = "Experimental framework comparing one-shot code RAG vs agent-directed code search for repository-level context retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AIP Research Group — Experimental Design Workstream" }
]
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "tiktoken>=0.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["repo_search"]
